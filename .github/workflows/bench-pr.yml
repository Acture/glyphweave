name: Bench (PR)

on:
  pull_request:
    types: [labeled, synchronize, opened, reopened]
    paths:
      - 'src/layout/**'
      - 'src/mask.rs'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

concurrency:
  group: bench-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bench:
    name: Compare bench against master
    if: contains(github.event.pull_request.labels.*.name, 'bench')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout master baseline
        uses: actions/checkout@v7
        with:
          ref: master
          path: baseline
          lfs: true

      - name: Checkout PR head
        uses: actions/checkout@v7
        with:
          path: pr
          lfs: true

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build (baseline)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: baseline

      - name: Cache build (PR)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: pr

      - name: Bench master baseline
        working-directory: baseline
        run: |
          cargo bench --bench layout_bench --features embedded_fonts -- --save-baseline master 2>&1 | tee ../baseline-bench.txt

      - name: Bench PR
        working-directory: pr
        run: |
          # Reuse master baseline saved above by copying target/criterion.
          # Fail loud if baseline is missing rather than silently producing
          # an uncompared bench run.
          mkdir -p target
          cp -r ../baseline/target/criterion target/criterion
          cargo bench --bench layout_bench --features embedded_fonts -- --baseline-lenient master 2>&1 | tee ../pr-bench.txt

      - name: Format comparison summary
        id: summary
        run: |
          set -o pipefail
          # `grep | head` exits 0 even when grep matched nothing, so the
          # `||` fallback never fires. Capture filtered output and only
          # fall back to a tail dump when the filter produced no lines.
          matched=$(grep -E 'time:|change:|Performance has' pr-bench.txt | head -80 || true)
          if [ -z "$matched" ]; then
            matched=$(tail -80 pr-bench.txt)
          fi
          {
            echo '## 📊 Bench comparison (master baseline → PR)'
            echo
            echo '<details><summary>Full output (PR vs master)</summary>'
            echo
            echo '```'
            echo "$matched"
            echo '```'
            echo
            echo '</details>'
          } > comment.md
          echo "comment_path=comment.md" >> "$GITHUB_OUTPUT"

      - name: Post comment to PR
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: ${{ steps.summary.outputs.comment_path }}
          edit-mode: replace
