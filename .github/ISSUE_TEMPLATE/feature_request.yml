name: ✨ Feature Request
description: Suggest a new capability or improvement
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature. Please describe the use case
        first — concrete problem statements help prioritize.
  - type: textarea
    id: problem
    attributes:
      label: Problem / use case
      description: What are you trying to accomplish that GlyphWeave currently makes hard?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: What would the new capability look like? CLI flag, library API, output format, etc.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, workarounds, or designs you've thought about.
  - type: dropdown
    id: scope
    attributes:
      label: Surface area
      multiple: true
      options:
        - CLI flag
        - Library API
        - Layout algorithm
        - Output format / SVG
        - Documentation
        - Build / CI
        - Other
